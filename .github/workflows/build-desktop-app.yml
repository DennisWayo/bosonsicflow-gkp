name: build-desktop-app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt

      - name: Build app (macOS)
        if: runner.os == 'macOS'
        run: |
          cd pyqt_gui
          PYTHON_BIN="$(python -c 'import sys; print(sys.executable)')" ./build_macos.sh

      - name: Build app (Linux)
        if: runner.os == 'Linux'
        run: |
          cd pyqt_gui
          PYTHON_BIN="$(python -c 'import sys; print(sys.executable)')" ./build_linux.sh

      - name: Build app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location pyqt_gui
          $env:PYTHON_BIN = (Get-Command python).Source
          .\build_windows.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bosonicflow-gkp-${{ runner.os }}-dist
          path: pyqt_gui/dist/bosonicflow-gkp*
